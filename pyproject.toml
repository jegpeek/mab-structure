[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mabsf"
version = "0.1.0"
description = "3D structure of the Cas A light-echo cloud 'Mab' from JWST NIRCam: structure functions, ellipsoid shapes and PSF correction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7",
  "astropy>=5.3", "h5py>=3.8", "pooch>=1.7",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbconvert", "ipykernel"]
test = ["pytest>=7"]

[project.scripts]
mabsf = "mabsf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mabsf = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
